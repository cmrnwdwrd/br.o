name: Collect BottleRag history

on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
    inputs:
      collector_source:
        description: "Collector source"
        required: false
        default: "primary"

permissions:
  contents: write

concurrency:
  group: bottlerag-history-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check whether collector should run
        id: fallback
        run: |
          # workflow_dispatch means Cloudflare/manual/cron-job.org/page-open dispatch.
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run_collector=true" >> "$GITHUB_OUTPUT"
            SOURCE="${{ inputs.collector_source }}"
            if [ -z "$SOURCE" ]; then
              SOURCE="primary"
            fi
            echo "collector_source=$SOURCE" >> "$GITHUB_OUTPUT"
            echo "Dispatched collector source: $SOURCE"
            exit 0
          fi

          # GitHub schedule is the 2nd fallback watchdog.
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path("data/listener_history.json")
          run_collector = True

          try:
              data = json.loads(path.read_text(encoding="utf-8"))
              updated = data.get("updatedAt")

              if updated:
                  updated_dt = datetime.fromisoformat(
                      updated.replace("Z", "+00:00")
                  )
                  age = (
                      datetime.now(timezone.utc) - updated_dt
                  ).total_seconds() / 60

                  print(f"Listener history age: {age:.1f} minutes")

                  if age < 14:
                      run_collector = False
              else:
                  print("No updatedAt found; fallback will run.")

          except Exception as e:
              print(f"Could not read collector age: {e}")
              print("Fallback will run.")

          output = os.environ["GITHUB_OUTPUT"]

          with open(output, "a", encoding="utf-8") as f:
              f.write(
                  "run_collector="
                  + ("true" if run_collector else "false")
                  + "\n"
              )
              f.write(
                  "collector_source="
                  + ("github-fallback" if run_collector else "none")
                  + "\n"
              )

          if run_collector:
              print("Collector is stale: GitHub 2nd fallback will run.")
          else:
              print("Collector is healthy: fallback not needed.")
          PY

      - name: Collect station history and listener sample
        if: steps.fallback.outputs.run_collector == 'true'
        env:
          BOTTLERAG_COLLECTOR_SOURCE: ${{ steps.fallback.outputs.collector_source }}
        run: python scripts/collect_bottlerag.py

      - name: Commit updated history
        if: steps.fallback.outputs.run_collector == 'true'
        run: |
          if git diff --quiet -- data/; then
            echo "No data changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/
          git commit -m "Update BottleRag history"
          git push

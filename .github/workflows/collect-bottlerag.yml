name: Collect BottleRag history

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bottlerag-history-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check whether scheduled fallback is needed
        id: fallback
        run:
          # Cloudflare uses workflow_dispatch, so those runs should always collect.background
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run_collector=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare/manual dispatch: collector will run."
            exit 0
          fi

          # GitHub schedule is only a fallback.
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path("data/listener_history.json")

          run_collector = True

          try:
              data = json.loads(path.read_text(encoding="utf-8"))
              updated = data.get("updatedAt")

              if updated:
                  updated_dt = datetime.fromisoformat(
                      updated.replace("Z", "+00:00")
                  )
                  age = (
                      datetime.now(timezone.utc) - updated_dt
                  ).total_seconds() / 60

                  print(f"Listener history age: {age:.1f} minutes")

                  if age < 14:
                      run_collector = False
              else:
                  print("No updatedAt found; fallback will run.")

          except Exception as e:
              print(f"Could not read collector age: {e}")
              print("Fallback will run.")

          output = os.environ["GITHUB_OUTPUT"]

          with open(output, "a", encoding="utf-8") as f:
              f.write(
                  "run_collector="
                  + ("true" if run_collector else "false")
                  + "\n"
              )

          if run_collector:
              print("Collector is stale: GitHub fallback will run.")
          else:
              print("Collector is healthy: fallback not needed.")
          PY


      - name: Collect station history and listener sample
        run: python scripts/collect_bottlerag.py

      - name: Commit updated history
        run: |
          if git diff --quiet -- data/; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Update BottleRag history"
          git push
